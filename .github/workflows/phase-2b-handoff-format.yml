name: Phase 2B Handoff Format

on:
  push:
    branches:
      - phase/2b-firebase-connectivity-foundation

permissions:
  contents: write

jobs:
  format-handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase/2b-firebase-connectivity-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Format handover
        run: npx prettier --write docs/handoffs/HANDOFF-2026-08-22-STUDIO37-PHASE-2B.md

      - name: Commit formatted handover
        shell: bash
        run: |
          git add docs/handoffs/HANDOFF-2026-08-22-STUDIO37-PHASE-2B.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: format Studio37 Phase 2B handover"
          git push origin HEAD:phase/2b-firebase-connectivity-foundation
