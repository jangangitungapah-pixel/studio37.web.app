name: Quality

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm --prefix functions install --no-audit --no-fund

      - name: Diagnose Phase 6E formatting
        shell: bash
        run: |
          npx prettier --write \
            docs/architecture/TRUSTED-BOOKING-COMPENSATION-EXECUTION-CONTRACT.md \
            functions/src/trustedBookingCompensationCore.test.js \
            functions/src/trustedBookingCompensationFirestoreGateway.test.js
          git diff -- \
            docs/architecture/TRUSTED-BOOKING-COMPENSATION-EXECUTION-CONTRACT.md \
            functions/src/trustedBookingCompensationCore.test.js \
            functions/src/trustedBookingCompensationFirestoreGateway.test.js
          exit 1
