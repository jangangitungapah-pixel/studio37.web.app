name: Quality

on:
  push:
    branches:
      - phase/6d2-booking-compensation-persistence

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: phase/6d2-booking-compensation-persistence
          fetch-depth: 0

      - name: Update legacy Firestore expectation
        shell: bash
        run: |
          python -c "from pathlib import Path; p=Path('tests/firestoreRules.emulator.js'); s=p.read_text(); old=\"test('keeps remaining not-yet-implemented domain collections default-deny', async () => {\"; new=\"test('keeps unprivileged booking and commission access denied after compensation activation', async () => {\"; assert old in s; p.write_text(s.replace(old,new,1))"
          python -c "from pathlib import Path; p=Path('tests/firestoreRules.emulator.js'); s=p.read_text(); old=\"await assertFails(getDoc(doc(ownerDb, 'bookings/booking-1')));\"; new=\"await assertSucceeds(getDoc(doc(ownerDb, 'bookings/booking-1')));\"; assert old in s; p.write_text(s.replace(old,new,1))"
          if git diff --quiet -- tests/firestoreRules.emulator.js; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/firestoreRules.emulator.js
          git commit -m "test(rules): align booking expectations with phase 6d2"
          git push origin HEAD:phase/6d2-booking-compensation-persistence
