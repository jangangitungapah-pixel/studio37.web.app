name: Quality

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: phase-2a-package-lock
          path: package-lock.json
          retention-days: 1

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Dev server smoke
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/studio37-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/studio37-vite.log
          exit 1
