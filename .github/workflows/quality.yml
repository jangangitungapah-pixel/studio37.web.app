name: Quality

on:
  push:
    branches:
      - main
      - 'phase/**'
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java for Firebase Emulator Suite
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Print Phase 6C formatting diff
        shell: bash
        run: |
          npx prettier --write \
            src/features/commissions/compensationEngine.js \
            src/features/commissions/compensationEngine.test.js
          git diff -- \
            src/features/commissions/compensationEngine.js \
            src/features/commissions/compensationEngine.test.js
          exit 1

      - name: Lint
        run: npm run lint

      - name: Test Phase 6A2 repository boundary
        run: npx vitest run src/services/compensationRuleRepository.test.js

      - name: Test Phase 6B management core
        run: >-
          npx vitest run
          src/features/commissions/compensationRuleManagement.test.js
          src/services/compensationRuleManagementService.test.js

      - name: Test Phase 6C compensation engine
        run: npx vitest run src/features/commissions/compensationEngine.test.js

      - name: Test Firestore Security Rules
        env:
          CI: true
          FIREBASE_CLI_DISABLE_UPDATE_CHECK: true
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Dev server smoke
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/studio37-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/studio37-vite.log
          exit 1

      - name: Test full unit suite
        run: npm test
