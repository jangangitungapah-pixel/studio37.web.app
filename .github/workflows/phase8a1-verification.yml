name: Phase 8A1 Verification

on:
  push:
    branches:
      - 'phase/8a1-booking-domain-foundation'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply Phase 8A1 formatting
        shell: bash
        run: |
          npx prettier --write \
            src/features/booking/bookings.js \
            src/features/booking/bookings.test.js \
            src/services/bookingRepository.js

          if git diff --quiet -- \
            src/features/booking/bookings.js \
            src/features/booking/bookings.test.js \
            src/services/bookingRepository.js; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/booking/bookings.js \
            src/features/booking/bookings.test.js \
            src/services/bookingRepository.js
          git commit -m "style(booking): apply Prettier formatting"
          git push origin HEAD:phase/8a1-booking-domain-foundation

      - name: Formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Test Phase 8A1 booking domain
        run: >-
          npx vitest run
          src/features/booking/bookings.test.js
          src/services/bookingRepository.test.js

      - name: Build
        run: npm run build

      - name: Dev server smoke
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/studio37-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:5173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/studio37-vite.log
          exit 1

      - name: Test full unit suite
        run: npm test
