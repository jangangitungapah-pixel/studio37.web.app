name: Phase 8A1 Verification

on:
  push:
    branches:
      - 'phase/8a1-booking-domain-foundation'
    paths-ignore:
      - '.phase8a1-vitest-diagnostic.txt'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Capture full unit suite diagnostic
        shell: bash
        run: |
          set +e
          npm test -- --reporter=verbose > /tmp/vitest-full.log 2>&1
          TEST_EXIT=$?
          set -e

          {
            printf 'exit_code=%s\n' "$TEST_EXIT"
            printf '%s\n' '--- tail ---'
            tail -n 400 /tmp/vitest-full.log
          } > .phase8a1-vitest-diagnostic.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .phase8a1-vitest-diagnostic.txt
          git commit -m "ci(booking): capture Vitest failure diagnostic"
          git push origin HEAD:phase/8a1-booking-domain-foundation
