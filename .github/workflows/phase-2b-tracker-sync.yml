name: Phase 2B Tracker Sync

on:
  push:
    branches:
      - phase/2b-firebase-connectivity-foundation

permissions:
  contents: write

jobs:
  sync-tracker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase/2b-firebase-connectivity-foundation

      - name: Update PRD-18 Phase 2B checkpoint
        shell: python
        run: |
          from pathlib import Path

          path = Path('docs/prd/PRD-18-development-workplan.md')
          text = path.read_text()

          replacements = {
              '- [ ] Configure Firebase Emulator Suite where practical.': '- [x] Configure Firebase Emulator Suite where practical.',
              '- [ ] Implement repository/service layer conventions.': '- [x] Implement repository/service layer conventions.',
              '- [ ] Emulator/dev strategy documented.': '- [x] Emulator/dev strategy documented.',
              '- Backend connectivity, Emulator Suite strategy, repository/service conventions, converters, data utilities, and Firestore index documentation remain open for later Phase 2 slices.': '- Phase 2B configured Auth/Firestore emulator routing with a production guard, documented the real-project vs emulator strategy, added a manual Firestore connectivity probe, and established a shared focused document repository without a generic full-collection list operation.\n- Phase 2B connectivity/repository unit tests and the synchronized Firebase package lock passed GitHub Actions Quality run `32494354595` with formatting, lint, tests, production build, and Vite development-server smoke.\n- Firebase backend connectivity confirmation remains pending a manual `/dev/firebase` probe; converters, core data utilities, and Firestore index documentation remain for Phase 2C.',
              '  - [ ] Remaining Phase 2 emulator, repository, converters, data utilities, connectivity, and index work.': '  - [x] Phase 2B — emulator routing, connectivity probe, and repository foundation implemented and quality-gated.\n  - [ ] Remaining Phase 2 connectivity confirmation, converters, data utilities, and index work.',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing expected tracker text: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Commit tracker checkpoint
        shell: bash
        run: |
          git add docs/prd/PRD-18-development-workplan.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs(phase-2b): record Firebase infrastructure progress"
          git push origin HEAD:phase/2b-firebase-connectivity-foundation
