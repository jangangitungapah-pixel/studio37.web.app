name: Phase 2B Lockfile Sync

on:
  push:
    branches:
      - phase/2b-firebase-connectivity-foundation

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: phase/2b-firebase-connectivity-foundation

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit refreshed lockfile
        shell: bash
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync Firebase package lock"
          git push origin HEAD:phase/2b-firebase-connectivity-foundation
